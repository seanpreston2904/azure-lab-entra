name: Terraform Apply

on:
    push:
        branches:
            - master

permissions:
    id-token: write
    contents: read
    actions: read
    pull-requests: read

jobs:
    detect_solutions:
        name: Detect Changed Solutions
        runs-on: ubuntu-latest

        outputs:
            solutions: ${{ steps.detect.outputs.solutions }}
            plan_run_id: ${{ steps.resolve_plan.outputs.plan_run_id }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Detect changed solution directories
              id: detect
              run: |
                  set -euo pipefail

                  before="${{ github.event.before }}"
                  if [ "$before" = "0000000000000000000000000000000000000000" ]; then
                      before="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
                  fi

                  changed_files=$(git diff --name-only "$before" "${{ github.event.after }}")

                  solutions=()
                  while IFS= read -r file; do
                      [ -z "$file" ] && continue
                      dir=$(dirname "$file")
                      while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
                          if [ -f "$dir/main.tf" ]; then
                              solutions+=("$dir")
                              break
                          fi
                          dir=$(dirname "$dir")
                      done
                  done <<< "$changed_files"

                  unique_solutions=$(printf '%s\n' "${solutions[@]:-}" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

                  echo "Detected solutions: $unique_solutions"
                  echo "solutions=$unique_solutions" >> "$GITHUB_OUTPUT"

            - name: Resolve source PR's plan run
              id: resolve_plan
              if: steps.detect.outputs.solutions != '[]'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                REPO: ${{ github.repository }}
                MERGE_SHA: ${{ github.event.after }}
              run: |
                  set -euo pipefail

                  pr_number=$(gh api "repos/$REPO/commits/$MERGE_SHA/pulls" --jq '.[0].number')
                  if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
                      echo "::error::No pull request associated with commit $MERGE_SHA - cannot locate a reviewed plan to apply."
                      exit 1
                  fi

                  head_sha=$(gh api "repos/$REPO/pulls/$pr_number" --jq '.head.sha')
                  echo "Source PR #$pr_number, head SHA $head_sha"

                  plan_run_id=$(gh api "repos/$REPO/actions/workflows/tf_plan.yml/runs?head_sha=$head_sha&status=success" \
                      --jq '.workflow_runs[0].id')
                  if [ -z "$plan_run_id" ] || [ "$plan_run_id" = "null" ]; then
                      echo "::error::No successful Terraform Plan run found for PR #$pr_number (head $head_sha). Re-run the plan before merging."
                      exit 1
                  fi

                  echo "Using plan run $plan_run_id"
                  echo "plan_run_id=$plan_run_id" >> "$GITHUB_OUTPUT"

    terraform_apply:
        name: Terraform Apply (${{ matrix.solution }})
        needs: detect_solutions
        if: needs.detect_solutions.outputs.solutions != '[]'
        runs-on: ubuntu-latest

        environment: terraform-apply

        strategy:
            fail-fast: false
            matrix:
                solution: ${{ fromJson(needs.detect_solutions.outputs.solutions) }}

        defaults:
            run:
                working-directory: ${{ matrix.solution }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download reviewed plan
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                REPO: ${{ github.repository }}
              run: |
                  gh run download "${{ needs.detect_solutions.outputs.plan_run_id }}" \
                      --repo "$REPO" \
                      --name "tfplan-${{ replace(matrix.solution, '/', '-') }}" \
                      --dir .

            - name: Log in to Azure
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.TF_CLIENT_ID }}
                tenant-id: ${{ secrets.TF_TENANT_ID }}
                subscription-id: ${{ secrets.TF_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.15.8"

            - name: Terraform Init
              run: terraform init -input=false

            - name: Terraform Apply
              run: terraform apply -input=false tfplan
