name: Terraform Apply

on:
    push:
        branches:
            - master

permissions:
    id-token: write
    contents: read

jobs:
    detect_solutions:
        name: Detect Changed Solutions
        runs-on: ubuntu-latest

        outputs:
            solutions: ${{ steps.detect.outputs.solutions }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Detect changed solution directories
              id: detect
              run: |
                  set -euo pipefail

                  before="${{ github.event.before }}"
                  if [ "$before" = "0000000000000000000000000000000000000000" ]; then
                      before="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
                  fi

                  changed_files=$(git diff --name-only "$before" "${{ github.event.after }}")

                  solutions=()
                  while IFS= read -r file; do
                      [ -z "$file" ] && continue
                      dir=$(dirname "$file")
                      while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
                          if [ -f "$dir/main.tf" ]; then
                              solutions+=("$dir")
                              break
                          fi
                          dir=$(dirname "$dir")
                      done
                  done <<< "$changed_files"

                  unique_solutions=$(printf '%s\n' "${solutions[@]:-}" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

                  echo "Detected solutions: $unique_solutions"
                  echo "solutions=$unique_solutions" >> "$GITHUB_OUTPUT"

    terraform_apply:
        name: Terraform Apply (${{ matrix.solution }})
        needs: detect_solutions
        if: needs.detect_solutions.outputs.solutions != '[]'
        runs-on: ubuntu-latest

        environment: terraform-apply

        strategy:
            fail-fast: false
            matrix:
                solution: ${{ fromJson(needs.detect_solutions.outputs.solutions) }}

        defaults:
            run:
                working-directory: ${{ matrix.solution }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to Azure
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.TF_CLIENT_ID }}
                tenant-id: ${{ secrets.TF_TENANT_ID }}
                subscription-id: ${{ secrets.TF_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.15.8"

            - name: Terraform Init
              run: terraform init -input=false

            - name: Terraform Apply
              run: terraform apply -input=false -auto-approve
