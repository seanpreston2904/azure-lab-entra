name: Terraform Plan

on:
    pull_request:

permissions:
    id-token: write
    contents: read
    pull-requests: write

jobs:
    detect_solutions:
        name: Detect Changed Solutions
        runs-on: ubuntu-latest

        outputs:
            solutions: ${{ steps.detect.outputs.solutions }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Detect changed solution directories
              id: detect
              run: |
                  set -euo pipefail

                  changed_files=$(git diff --name-only \
                      "${{ github.event.pull_request.base.sha }}" \
                      "${{ github.event.pull_request.head.sha }}")

                  solutions=()
                  while IFS= read -r file; do
                      [ -z "$file" ] && continue
                      dir=$(dirname "$file")
                      while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
                          if [ -f "$dir/main.tf" ]; then
                              solutions+=("$dir")
                              break
                          fi
                          dir=$(dirname "$dir")
                      done
                  done <<< "$changed_files"

                  unique_solutions=$(printf '%s\n' "${solutions[@]:-}" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

                  echo "Detected solutions: $unique_solutions"
                  echo "solutions=$unique_solutions" >> "$GITHUB_OUTPUT"

    terraform_plan:
        name: Terraform Plan (${{ matrix.solution }})
        needs: detect_solutions
        if: needs.detect_solutions.outputs.solutions != '[]'
        runs-on: ubuntu-latest

        environment: terraform-plan

        strategy:
            fail-fast: false
            matrix:
                solution: ${{ fromJson(needs.detect_solutions.outputs.solutions) }}

        defaults:
            run:
                working-directory: ${{ matrix.solution }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to Azure
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.TF_CLIENT_ID }}
                tenant-id: ${{ secrets.TF_TENANT_ID }}
                subscription-id: ${{ secrets.TF_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.15.8"

            - name: Terraform Init
              run: terraform init -input=false

            - name: Terraform Plan
              id: plan
              run: |
                  set -o pipefail
                  terraform plan -no-color -input=false -out=tfplan | tee plan_output.txt

            - name: Format plan markdown
              if: always() && steps.plan.outcome != 'skipped'
              run: |
                  python3 "$GITHUB_WORKSPACE/.github/scripts/format_plan.py" \
                      "${{ matrix.solution }}" plan_output.txt > plan_comment.md

            - name: Add plan to job summary
              if: always() && steps.plan.outcome != 'skipped'
              run: cat plan_comment.md >> "$GITHUB_STEP_SUMMARY"

            - name: Comment on pull request
              if: always() && steps.plan.outcome != 'skipped'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                REPO: ${{ github.repository }}
                PR_NUMBER: ${{ github.event.pull_request.number }}
                MARKER: "<!-- terraform-plan:${{ matrix.solution }} -->"
              run: |
                  set -euo pipefail

                  existing_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                      --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

                  if [ -n "$existing_id" ]; then
                      gh api "repos/$REPO/issues/comments/$existing_id" -X PATCH -f body=@plan_comment.md
                  else
                      gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST -f body=@plan_comment.md
                  fi
