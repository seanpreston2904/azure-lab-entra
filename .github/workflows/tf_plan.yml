name: Terraform Plan

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    terraform_plan:
        name: Terraform Plan
        runs-on: ubuntu-latest

        environment: terraform-apply

        steps:
            - name: Log in to Azure
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.TF_CLIENT_ID }}
                tenant-id: ${{ secrets.TF_TENANT_ID }}
                subscription-id: ${{ secrets.TF_SUBSCRIPTION_ID }}

            - name: Azure CLI Test
              uses: azure/cli@v2
              with:
                azcliversion: latest
                inlinescript: |
                  az account show